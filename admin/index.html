<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin CRM | British Flight Center</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("bfc-admin-theme");
        var theme = saved === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body class="admin-body">
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></symbol>
        <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></symbol>
        <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
        <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></symbol>
        <symbol id="icon-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></symbol>
        <symbol id="icon-log-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></symbol>
      </defs>
    </svg>

    <header class="admin-topbar">
      <div>
        <h1>Submission CRM</h1>
        <p id="admin-session-email" class="muted"></p>
      </div>
      <div class="admin-topbar-actions">
        <button
          id="theme-toggle-btn"
          class="icon-btn ghost-btn"
          type="button"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
        >
          <svg class="icon"><use id="theme-toggle-icon" href="#icon-moon"></use></svg>
        </button>
        <button id="admin-logout-btn" class="icon-btn ghost-btn" type="button" title="Logout" aria-label="Logout">
          <svg class="icon"><use href="#icon-log-out"></use></svg>
        </button>
      </div>
    </header>

    <nav class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab is-active" data-tab="submissions" role="tab" aria-selected="true">
        Submissions
      </button>
      <button type="button" class="admin-tab" data-tab="users" role="tab" aria-selected="false">Admin Users</button>
    </nav>

    <main class="admin-layout">
      <div id="tab-submissions" class="admin-tab-panel is-active" role="tabpanel">
        <section class="admin-card">
          <div class="section-head">
            <h2>Submissions</h2>
            <p id="table-meta" class="muted"></p>
          </div>

          <form id="filters-form" class="toolbar">
            <select name="status" title="Filter by status" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="qualified">Qualified</option>
              <option value="closed">Closed</option>
              <option value="spam">Spam</option>
            </select>
            <select name="source" title="Filter by source" aria-label="Filter by source">
              <option value="">All sources</option>
              <option value="booking">Booking</option>
              <option value="contact">Contact</option>
            </select>
            <input name="q" type="search" placeholder="Search ID, name, email, phone" title="Search" aria-label="Search" />
            <input name="dateFrom" type="date" title="Date from" aria-label="Date from" />
            <input name="dateTo" type="date" title="Date to" aria-label="Date to" />
            <select name="sort" title="Sort order" aria-label="Sort order">
              <option value="created_desc">Newest</option>
              <option value="created_asc">Oldest</option>
              <option value="updated_desc">Recently Updated</option>
              <option value="updated_asc">Least Recently Updated</option>
            </select>
            <div class="toolbar-actions">
              <button
                type="button"
                id="filters-reset"
                class="icon-btn ghost-btn"
                title="Reset filters"
                aria-label="Reset filters"
              >
                <svg class="icon"><use href="#icon-refresh"></use></svg>
              </button>
              <button
                type="button"
                id="export-csv-btn"
                class="icon-btn ghost-btn"
                title="Export CSV"
                aria-label="Export CSV"
              >
                <svg class="icon"><use href="#icon-download"></use></svg>
              </button>
            </div>
          </form>

          <div class="table-wrap">
            <table class="table-compact">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Source</th>
                  <th>Status</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Created</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="submissions-tbody"></tbody>
            </table>
          </div>
          <div class="pager">
            <button type="button" id="prev-page" class="icon-btn ghost-btn" title="Previous page" aria-label="Previous page">
              <svg class="icon"><use href="#icon-chevron-left"></use></svg>
            </button>
            <span id="page-label">Page 1</span>
            <button type="button" id="next-page" class="icon-btn ghost-btn" title="Next page" aria-label="Next page">
              <svg class="icon"><use href="#icon-chevron-right"></use></svg>
            </button>
          </div>
        </section>
      </div>

      <div id="tab-users" class="admin-tab-panel" role="tabpanel">
        <section class="admin-card">
          <div class="section-head">
            <h2>Admin Users</h2>
            <p id="users-meta" class="muted"></p>
          </div>
          <div class="table-wrap">
            <table class="table-compact">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Created</th>
                  <th>Last Login</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>

          <h3>Add Admin User</h3>
          <form id="user-create-form" class="filters-grid">
            <label>
              Email
              <input name="email" type="email" required placeholder="name@example.com" />
            </label>
            <label>
              Password
              <input name="password" type="password" required minlength="10" placeholder="At least 10 characters" />
            </label>
            <div class="filters-actions">
              <button type="submit" class="icon-btn" title="Add admin user" aria-label="Add admin user">
                <svg class="icon"><use href="#icon-plus"></use></svg>
              </button>
            </div>
          </form>
          <p id="user-create-msg" class="error-text"></p>
        </section>
      </div>
    </main>

    <div id="user-edit-overlay" class="detail-overlay" hidden></div>
    <aside id="user-edit-sidebar" class="detail-sidebar" aria-hidden="true">
      <div class="detail-sidebar-head">
        <h2>Edit Admin User</h2>
        <button
          type="button"
          id="user-edit-close-btn"
          class="icon-btn ghost-btn"
          title="Close"
          aria-label="Close"
        >
          <svg class="icon"><use href="#icon-x"></use></svg>
        </button>
      </div>

      <form id="user-edit-form" class="stack">
        <label>
          Email
          <input name="email" type="email" required />
        </label>
        <label>
          New Password
          <input name="password" type="password" minlength="10" placeholder="Leave blank to keep current password" />
        </label>
        <button type="submit" class="icon-btn" title="Save changes" aria-label="Save changes">
          <svg class="icon"><use href="#icon-save"></use></svg>
        </button>
        <p id="user-edit-msg" class="error-text"></p>
      </form>
    </aside>

    <div id="detail-overlay" class="detail-overlay" hidden></div>
    <aside id="detail-sidebar" class="detail-sidebar" aria-hidden="true">
      <div class="detail-sidebar-head">
        <h2>Submission Detail</h2>
        <button type="button" id="detail-close-btn" class="icon-btn ghost-btn" title="Close" aria-label="Close">
          <svg class="icon"><use href="#icon-x"></use></svg>
        </button>
      </div>

      <dl id="detail-grid" class="detail-grid"></dl>

      <form id="detail-update-form" class="stack">
        <label>
          Status
          <select name="status" required>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
            <option value="closed">Closed</option>
            <option value="spam">Spam</option>
          </select>
        </label>
        <label>
          Admin Notes
          <textarea name="admin_notes" rows="5" placeholder="Internal notes"></textarea>
        </label>
        <button type="submit" class="icon-btn" title="Save updates" aria-label="Save updates">
          <svg class="icon"><use href="#icon-save"></use></svg>
        </button>
        <p id="detail-save-msg" class="muted"></p>
      </form>
    </aside>

    <script src="/admin/admin.js"></script>
  </body>
</html>
